# Conda environment for the Arabic scanned-PDF PII anonymizer.
#
#   conda env create -f environment.yml
#   conda activate arabic-anonymizer
#
# (to update after editing this file)
#   conda env update -f environment.yml --prune
name: arabic-anonymizer
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # --- Core pipeline ---
      - python-docx==1.1.2      # build the output .docx (RTL Arabic via OOXML)
      - pypdf==5.1.0           # split big PDFs into page-batches
      - python-dotenv==1.0.1   # load configuration from .env
      - tenacity==9.0.0        # retry/backoff around LLM calls
      - tqdm==4.66.5           # progress bar
      - google-genai==1.9.0    # Gemini provider (native PDF OCR + PII detection)
