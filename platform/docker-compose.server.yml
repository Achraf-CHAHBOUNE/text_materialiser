# What changes on a server, on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# The site answers on 80/443 with a certificate Caddy fetches and renews for
# SITE_ADDRESS, and every service is capped so the platform cannot crowd out
# whatever else the machine runs. A share of the CPUs is used, never named cores.
#
# More readers: raise API_WORKERS, or run more backend copies
#   docker compose ... up -d --scale backend=3
# Caddy spreads the requests over them; none keeps anything of its own.

services:
  postgres:
    cpus: "2.0"
    mem_limit: 4g

  garage:
    cpus: "1.0"
    mem_limit: 1g

  backend:
    cpus: "2.0"
    mem_limit: 4g

  worker:
    cpus: "0.5"
    mem_limit: 512m

  frontend:
    cpus: "1.0"
    mem_limit: 1g

  proxy:
    cpus: "0.5"
    mem_limit: 512m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?REQUIRED on a server - the hostname, e.g. jurisprudence.example.ma}
    ports: !override
      - "80:80"
      - "443:443"
