# The platform on a server of your own: PostgreSQL, the documents on the server's
# disk, and HTTPS with a certificate that renews itself.
#
#   cp .env.example .env     # fill in the secrets, then:
#   docker compose -f docker-compose.server.yml up -d --build
#
# SITE_ADDRESS is the hostname people type. With no domain yet, sslip.io turns the
# server's own IP into one (169-58-22-102.sslip.io -> 169.58.22.102), which is a real
# name, so Let's Encrypt will issue a certificate for it. Point a bought domain at
# the server later and change this one line.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anonymize}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anon}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anonymize}
      FILESTORE_DIR: /documents
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TTL_SECONDS: ${AUTH_TTL_SECONDS:-86400}
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      ALLOW_ORIGINS: ${SITE_URL:-*}
      AUTO_PUBLISH: "1"
    volumes:
      - documents:/documents          # the anonymized .docx files
      - ./incoming:/incoming:ro       # what you upload, to import from
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""              # same address as the page: no URL baked in
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # keeps the certificate across restarts
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pg-data:
  documents:
  caddy-data:
  caddy-config:
  caddy-logs:
