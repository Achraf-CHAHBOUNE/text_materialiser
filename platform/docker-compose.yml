# The whole platform, one command:
#
#   cp .env.example .env        # then fill in the lines marked REQUIRED
#   docker compose up -d --build
#   open http://localhost:8080
#
# Only the proxy is reachable from outside. Every other service talks on the private
# network, and the data lives in the named volumes at the bottom: Postgres for the
# records, Garage (S3-compatible) for the Word files.
#
# On a server, add the server file:  docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
# To move the data of a SQLite install in:  see "Moving in" in docs/OPERATIONS.md

x-backend: &backend
  build: ./backend
  image: tok-backend:local
  restart: unless-stopped
  environment: &backend_env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anon}:${POSTGRES_PASSWORD:?REQUIRED - set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-anonymize}
    S3_ENDPOINT: garage:3900
    S3_REGION: garage
    S3_SECURE: "false"                      # private network only
    S3_BUCKET: ${S3_BUCKET:-anonymized}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?REQUIRED - set S3_ACCESS_KEY in .env}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?REQUIRED - set S3_SECRET_KEY in .env}
    AUTH_SECRET: ${AUTH_SECRET:?REQUIRED - set AUTH_SECRET in .env}
    AUTH_TTL_SECONDS: ${AUTH_TTL_SECONDS:-86400}
    SEED_EMAIL: ${SEED_EMAIL:-}
    SEED_PASSWORD: ${SEED_PASSWORD:-}
    ALLOW_ORIGINS: ${SITE_URL:-*}
    AUTO_PUBLISH: ${AUTO_PUBLISH:-1}
    API_WORKERS: ${API_WORKERS:-1}
    # the French translation button; without a key it says it is unavailable
    TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
    TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
    # the model step after each import (backend/enrich.py): off unless AUTO_ENRICH=1
    AUTO_ENRICH: ${AUTO_ENRICH:-0}
    ENRICH_PER_PASS: ${ENRICH_PER_PASS:-200}
    LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
    LLM_MODEL: ${LLM_MODEL:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    # emails: the worker sends them; without SMTP_HOST they wait in the outbox
    SITE_URL: ${SITE_URL:-http://localhost:8080}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_TLS: ${SMTP_TLS:-1}
    SELLER_NAME: ${SELLER_NAME:-}
    SELLER_ADDRESS: ${SELLER_ADDRESS:-}
    SELLER_ICE: ${SELLER_ICE:-}
    SELLER_RIB: ${SELLER_RIB:-}
  depends_on:
    postgres:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?REQUIRED - set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anonymize}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anon} -d ${POSTGRES_DB:-anonymize}"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?REQUIRED - set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?REQUIRED - set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Gives Garage its node, key and bucket, then exits. Changes nothing already in place.
  storage-init:
    build: ./backend
    image: tok-backend:local
    command: python -m ops.storage_init
    restart: "no"
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?REQUIRED - set GARAGE_ADMIN_TOKEN in .env}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-100G}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?REQUIRED - set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?REQUIRED - set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-anonymized}
    depends_on:
      - garage

  backend:
    <<: *backend

  # emails, expiries, reminders, the admin digest (backend/worker.py)
  worker:
    <<: *backend
    command: python worker.py
    healthcheck:
      disable: true

  frontend:
    build: ./frontend
    image: tok-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # The one door in: the site and its API under one address.
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pg-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
  caddy-logs:
