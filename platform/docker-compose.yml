services:
  # File storage for the anonymized documents, self-hosted. To use AWS S3 or Google
  # Cloud Storage instead, set S3_ENDPOINT and the keys in .env and delete this
  # service (and its depends_on below) -- the backend speaks the same protocol to all
  # three. See "Where the files live" in README.md.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in platform/.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in platform/.env}
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # web console
    volumes:
      - minio-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anon}
      POSTGRES_DB: ${POSTGRES_DB:-anonymize}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # Ingest-only: NO engine, NO Gemini key. Stores only anonymized content.
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in platform/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in platform/.env}
      S3_BUCKET: ${S3_BUCKET:-anonymized}
      S3_REGION: ${S3_REGION:-}
      S3_SECURE: ${S3_SECURE:-false}          # plain HTTP is for the local MinIO only
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}   # local MinIO starts empty
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anon}:${POSTGRES_PASSWORD:-anon}@postgres:5432/${POSTGRES_DB:-anonymize}
      ALLOW_ORIGINS: "*"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_CLIENT_EMAIL: ${SEED_CLIENT_EMAIL:-}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      - minio
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  minio-data:
  pg-data:
