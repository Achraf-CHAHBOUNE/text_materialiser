# Changes to the database's structure, one numbered file each in migrations/versions.
#
#   alembic revision --autogenerate -m "what changes"   # write one, then read it
#   alembic upgrade head                                # apply (the backend does it at start)
#   alembic downgrade -1                                # undo the last one
#
# The database is the one the backend uses (settings: DATABASE_URL, or SQLite in DB_DIR).
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
