# The platform on a server that is busy with something else.
#
# Every service is pinned to cores 8-11 and capped in memory, so the site cannot
# take CPU from whatever else the machine is doing. Images are built beforehand
# (also pinned), so no build runs here.
#
#   docker compose -p tok -f docker-compose.vps.yml up -d
#   docker compose -p tok -f docker-compose.vps.yml down     # only this project
services:
  postgres:
    image: postgres:16-alpine
    cpuset: "8-9"
    mem_limit: 4g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anonymize}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anon}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: tok-backend:latest
    cpuset: "10-11"
    mem_limit: 4g
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anonymize}
      FILESTORE_DIR: /documents
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TTL_SECONDS: ${AUTH_TTL_SECONDS:-86400}
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      ALLOW_ORIGINS: ${SITE_URL:-*}
      AUTO_PUBLISH: "1"
    volumes:
      - documents:/documents
      - ./incoming:/incoming:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: tok-frontend:latest
    cpuset: "10-11"
    mem_limit: 2g
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    cpuset: "8-9"
    mem_limit: 1g
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pg-data:
  documents:
  caddy-data:
  caddy-config:
  caddy-logs:
