# The platform on a server that is busy with something else.
#
# Every service is capped in CPU and memory, so the site cannot crowd out whatever
# else the machine is doing. A share is used rather than named cores: when another
# job deliberately runs on 11 of 12 cores, we must not claim specific ones.
# Images are built beforehand, so no build runs here.
#
#   docker compose -p tok -f docker-compose.vps.yml up -d
#   docker compose -p tok -f docker-compose.vps.yml down     # only this project
services:
  postgres:
    image: postgres:16-alpine
    # The database does the heavy work on this site -- a search reads and decompresses
    # thousands of rulings -- so starving it at half a core while the API got a whole
    # one had it backwards. Two of twelve is still a small share of a machine whose
    # other job runs on about five.
    cpus: "2.0"
    mem_limit: 4g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anonymize}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anon}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: tok-backend:latest
    cpus: "1.0"
    mem_limit: 4g
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anonymize}
      FILESTORE_DIR: /documents
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TTL_SECONDS: ${AUTH_TTL_SECONDS:-86400}
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      ALLOW_ORIGINS: ${SITE_URL:-*}
      # The French translation button; without it the button says it is unavailable.
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-gemini-2.5-flash-lite}
      AUTO_PUBLISH: "1"
      # emails (worker.py sends them; without SMTP_HOST they wait in the outbox)
      SITE_URL: ${SITE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-1}
      # printed on invoices
      SELLER_NAME: ${SELLER_NAME:-}
      SELLER_ADDRESS: ${SELLER_ADDRESS:-}
      SELLER_ICE: ${SELLER_ICE:-}
      SELLER_RIB: ${SELLER_RIB:-}
    volumes:
      - documents:/documents
      - ./incoming:/incoming:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # emails, subscription expiries, renewal reminders, alerts (backend/worker.py)
  worker:
    image: tok-backend:latest
    command: python worker.py
    environment: *backend_env
    mem_limit: 512m
    volumes:
      - documents:/documents
      - ./incoming:/incoming:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: tok-frontend:latest
    cpus: "1.0"
    mem_limit: 2g
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    cpus: "0.5"
    mem_limit: 1g
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pg-data:
  documents:
  caddy-data:
  caddy-config:
  caddy-logs:
